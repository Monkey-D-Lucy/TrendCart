<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact TrendCart support for help with products, orders, and shopping assistance.">
  <title>Contact | TrendCart</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KK514XMCZT"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-KK514XMCZT');
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">TrendCart</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation">☰</button>
      <nav aria-label="Main navigation">
        <ul class="nav-links" id="primary-nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1>Contact TrendCart</h1>
      <p class="section-intro">Have a question? We are here to help.</p>

      <div class="contact-layout">
        <section class="contact-card" aria-labelledby="contact-details-title">
          <h2 id="contact-details-title">Contact Details</h2>
          <ul class="contact-list">
            <li><strong>Email:</strong> <a href="mailto:support@trendcart.example">support@trendcart.example</a></li>
            <li><strong>Phone:</strong> <a href="tel:+919876543210">+91 98765 43210</a></li>
            <li><strong>Location:</strong> Mumbai, Maharashtra, India</li>
          </ul>
        </section>

        <section class="contact-card" aria-labelledby="contact-form-title">
          <h2 id="contact-form-title">Send us a message</h2>
          <form id="contact-form" novalidate>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button class="btn btn-primary" type="submit">Send Message</button>
            <p id="form-feedback" class="form-feedback" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> TrendCart. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
